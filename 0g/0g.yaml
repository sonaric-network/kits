namespace: 0g

common:
  metadata:
    name: 0G (Zero Gravity)
    shortname: 0G (Zero Gravity)
    description: >-
      0G is a blockchain ecosystem described as the first decentralized AI
      operating system and the largest AI Layer 1 ecosystem. It operates on a
      Proof-of-Stake (PoS) mechanism, enabling participants to run validator
      nodes, validate transactions, propose new blocks, and earn rewards. The
      platform emphasizes decentralization, scalability, and community
      participation, with tools like Cosmovisor to streamline node operations
      and upgrades. It is designed to be infinitely scalable for AI and
      performant for everyone, enabling groundbreaking AI and Web3 applications.
    network: 0g
    publisher: Sonaric
    website: 'https://0g.ai'
    source: 'https://github.com/0glabs'
    currency: ua0gi
    icon: 'https://docs.0g.ai/img/logo.svg'
    tags: 'blockchain,ai,layer1,proof-of-stake,web3'

validator-node:
  defines: runnable
  inherits: 0g/common
  metadata:
    name: 0G Validator Node
    shortname: validator-node
    description: >-
      A validator node for the 0G blockchain ecosystem, enabling transaction
      validation, block proposal, and earning rewards.
    network: validator-node
  requirements:
    CPU: '4'
    RAM: 8192
    GPU: false
    disk: 100
  containers:
    node:
      image: 'ghcr.io/emberstake/0g-docker/node:v0.5.0'
      paths:
        - '<- `${monk-volume-path}/build-directory:/kvd`'
      entrypoint: /sonaric-init.sh
  actions:
    start-validator:
      container: node
      description: Start the validator node.
      code: exec("node", "/bin/bash", "-c", "/start-validator.sh")
  files:
    start-validator:
      container: node
      path: /start-validator.sh
      mode: 0755
      contents: <<< files/start-validator.sh
    init:
      container: node
      path: /sonaric-init.sh
      mode: 0755
      contents: |-
        #!/bin/bash
        
        0gchaind config chain-id zgtendermint_16600-2

        0gchaind init $KEY_NAME --chain-id zgtendermint_16600-2
        
        apt update
        apt install -y unzip wget
        
        rm /home/zerog/.0gchain/config/genesis.json
        wget -P /home/zerog/.0gchain/config https://github.com/0glabs/0g-chain/releases/download/v0.2.3/genesis.json
        
        0gchaind validate-genesis /home/zerog/.0gchain/config/genesis.json
        
        sed -i 's|seeds = ""|seeds = "81987895a11f6689ada254c6b57932ab7ed909b6@54.241.167.190:26656,010fb4de28667725a4fef26cdc7f9452cc34b16d@54.176.175.48:26656,e9b4bc203197b62cc7e6a80a64742e752f4210d5@54.193.250.204:26656,68b9145889e7576b652ca68d985826abd46ad660@18.166.164.232:26656"|' $HOME/.0gchain/config/config.toml
        
        (
        echo $PASSWORD
        echo $PASSWORD
        ) | 0gchaind keys add $KEY_NAME --eth
        
        0gchaind start

  services:
    p2p-port:
      container: node
      port: 26656
      host-port: 26656
      protocol: tcp
      publish: true
    rpc-port:
      container: node
      port: 26657
      host-port: 26657
      protocol: tcp
      publish: true
  variables:
    key_name:
      description: "Name of the key to use for the validator node."
      type: string
      value: ""
      required: true
      env: KEY_NAME
    password:
      description: "Password for the key."
      type: string
      value: ""
      required: true
      env: PASSWORD
    staking_amount:
      description: "Amount to stake."
      type: string
      value: "1"
      required: true
      env: STAKING_AMOUNT
    validator_name:
      description: "Name of the validator."
      type: string
      value: ""
      required: true
      env: VALIDATOR_NAME
    validator_description:
      description: "Description of the validator."
      type: string
      value: ""
      required: true
      env: VALIDATOR_DESCRIPTION
    chain_id:
      description: "Chain ID for the 0G network."
      type: string
      value: "zgtendermint_16600-2"
      required: true
      env: CHAIN_ID


